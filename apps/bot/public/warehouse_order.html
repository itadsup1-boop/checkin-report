<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <title>Xuất kho theo khách hàng</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="/mini-app/vendor/quagga.min.js"></script>
  <script src="/mini-app/barcode-scanner.js"></script>
  <style>
    :root{--bg:#f4f7fb;--card:#fff;--ink:#14213d;--muted:#64748b;--line:#dbe3ef;--brand:#0891b2;--ok:#059669;--warn:#d97706;--bad:#dc2626}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,sans-serif}button,input,select{font:inherit}button{cursor:pointer}
    .app{max-width:720px;margin:auto;padding:14px 14px 110px}.hero{background:linear-gradient(135deg,#0f172a,#164e63);color:#fff;border-radius:24px;padding:20px;margin-bottom:14px;box-shadow:0 14px 30px #0f172a24}.hero h1{font-size:22px;margin:0 0 5px}.hero p{margin:0;color:#bae6fd;font-size:13px}
    .card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:12px;box-shadow:0 5px 16px #1e293b0a}.card h2{font-size:16px;margin:0 0 12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:12px;font-weight:700;color:var(--muted)}
    input,select{width:100%;border:1px solid var(--line);background:#fff;border-radius:13px;padding:12px;color:var(--ink);outline:none}.services{display:grid;grid-template-columns:1fr 1fr;gap:9px}.service-option{border:1px solid var(--line);background:#fff;border-radius:14px;padding:12px;text-align:left;font-weight:700;color:var(--ink)}.service-option.on{border-color:var(--brand);background:#ecfeff;color:#0e7490}.service-option small{display:block;font-weight:500;color:var(--muted);margin-top:3px}
    .service-block{border:1px solid var(--line);border-radius:17px;overflow:hidden;margin-top:12px}.service-head{padding:12px;background:#f0fdfa;display:flex;align-items:center;justify-content:space-between;gap:8px}.service-head strong{color:#0f766e}.mini{border:0;border-radius:9px;padding:7px 9px;background:#e2e8f0;color:#334155;font-size:12px;font-weight:700}.mini.scan{background:#cffafe;color:#0e7490}.items{padding:0 12px}
    .item{padding:12px 0;border-bottom:1px solid #edf2f7}.item:last-child{border-bottom:0}.item-top{display:flex;justify-content:space-between;gap:8px}.item-name{font-weight:700;font-size:14px}.barcode{color:var(--muted);font:11px ui-monospace,monospace}.qty{display:flex;align-items:center;gap:7px;margin-top:8px}.qty button{width:34px;height:34px;border:0;border-radius:10px;background:#e2e8f0;font-size:18px}.qty input{width:68px;text-align:center;padding:7px}.remove,.undo{margin-left:auto;border:0;border-radius:9px;padding:7px 9px;font-size:12px}.remove{background:#fee2e2;color:#b91c1c}.undo{background:#dcfce7;color:#047857}.removed{opacity:.5}.removed .item-name{text-decoration:line-through}
    .stock{font-size:11px;margin-top:7px;color:var(--muted)}.stock.warn{color:var(--warn);font-weight:700}.stock.bad{color:var(--bad);font-weight:700}.add-row{display:grid;grid-template-columns:1fr auto;gap:8px;padding:10px 12px;background:#f8fafc}.add-row select{padding:9px}.notice{border-radius:14px;padding:12px;font-size:13px;margin-top:9px}.notice.ok{background:#ecfdf5;color:#047857}.notice.warn{background:#fff7ed;color:#c2410c}.notice.bad{background:#fef2f2;color:#b91c1c}.summary-service{margin-bottom:10px}.summary-service div{font-size:12px;color:var(--muted);padding:2px 0 0 10px}
    .sticky{position:fixed;z-index:50;left:0;right:0;bottom:0;padding:10px 14px max(10px,env(safe-area-inset-bottom));background:#ffffffed;border-top:1px solid var(--line);backdrop-filter:blur(10px)}.sticky-inner{max-width:692px;margin:auto;display:grid;grid-template-columns:1fr auto;gap:9px}.submit{border:0;border-radius:15px;background:linear-gradient(135deg,#0891b2,#06b6d4);color:#fff;padding:14px;font-weight:800}.submit:disabled{background:#94a3b8}.save{border:1px solid var(--line);border-radius:15px;background:#fff;padding:0 14px;font-weight:700;color:#475569}
    .overlay{display:none;position:fixed;inset:0;z-index:100;background:#020617ed;padding:18px}.overlay.on{display:flex;flex-direction:column}.scanner{position:relative;flex:1;max-height:70vh;border-radius:20px;overflow:hidden;background:#000}.close-scan{border:0;margin-top:12px;border-radius:14px;padding:13px;background:#fff;font-weight:800}.loading{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;background:#f8fafcf2}.loading.hide{display:none}.loader-card{background:#fff;border-radius:18px;padding:22px;text-align:center}.spin{width:34px;height:34px;border:4px solid #cffafe;border-top-color:var(--brand);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 10px}@keyframes spin{to{transform:rotate(360deg)}}
    @media(max-width:480px){.grid,.services{grid-template-columns:1fr}.hero{border-radius:0;margin:-14px -14px 14px}.card{border-radius:17px}}
  </style>
</head>
<body>
  <div id="loading" class="loading"><div class="loader-card"><div class="spin"></div><b>Đang tải mẫu dịch vụ…</b></div></div>
  <main class="app">
    <section class="hero"><h1>📤 Xuất kho cho khách</h1><p>Một khách • một đơn • có thể chọn nhiều dịch vụ</p></section>
    <section class="card"><h2>1. Khách hàng và cơ sở</h2><div class="grid">
      <div class="field full"><label>Tên khách *</label><input id="customerName" autocomplete="name" placeholder="Nhập tên khách hàng"></div>
      <div class="field"><label>Số điện thoại *</label><input id="customerPhone" inputmode="tel" autocomplete="tel" placeholder="09…"></div>
      <div class="field"><label>Cơ sở thực hiện *</label><select id="branch"><option value="">Chọn cơ sở</option><option value="US">MEDITECH (US)</option><option value="UK">UK</option></select></div>
    </div><div id="customerSuggestion" class="notice ok" style="display:none"></div></section>
    <section class="card"><h2>2. Chọn dịch vụ</h2><div id="serviceOptions" class="services"></div><div id="noServices" class="notice warn" style="display:none">Admin chưa cấu hình dịch vụ hoạt động.</div></section>
    <section class="card"><h2>3. Sản phẩm theo từng dịch vụ</h2><div id="selectedServices"></div><div id="emptySelection" class="notice warn">Hãy chọn ít nhất một dịch vụ.</div></section>
    <section class="card"><h2>4. Kiểm tra và gửi</h2><div id="stockWarnings"></div><div id="summary"></div></section>
  </main>
  <footer class="sticky"><div class="sticky-inner"><button id="submitButton" class="submit" disabled>Gửi đơn xuất kho</button><button id="clearButton" class="save">Xóa nháp</button></div></footer>
  <div id="scannerOverlay" class="overlay"><div id="scannerStage" class="scanner"></div><button id="closeScanner" class="close-scan">Đóng camera</button></div>
  <script>
    const tg=window.Telegram?.WebApp||null;tg?.ready();tg?.expand();
    const params=new URLSearchParams(location.search),chatId=params.get('chat_id')||'',ts=params.get('ts')||'',sig=params.get('sig')||'',action=params.get('action')||'whexport',initData=tg?.initData||'';
    const authQuery='chat_id='+encodeURIComponent(chatId)+'&ts='+encodeURIComponent(ts)+'&sig='+encodeURIComponent(sig)+'&action='+encodeURIComponent(action)+'&initData='+encodeURIComponent(initData);
    function newIdempotencyKey(){return globalThis.crypto?.randomUUID?.()||`${Date.now()}-${Math.random().toString(36).slice(2)}-${Math.random().toString(36).slice(2)}`}
    const draftKey='warehouse-service-order-draft:'+chatId;let services=[],products=[],inventory=new Map(),selections=new Map(),scanTargetServiceId=null,idempotencyKey=newIdempotencyKey(),customerTimer=null;
    const el=id=>document.getElementById(id),escapeHtml=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
    async function api(path,options={}){const response=await fetch(path,{...options,headers:{'Content-Type':'application/json','X-Telegram-Init-Data':initData,...(options.headers||{})}}),data=await response.json().catch(()=>({}));if(!response.ok||data.success===false){const error=new Error(data.message||'Không thể kết nối máy chủ.');error.details=data.details;throw error}return data}
    const stockFor=id=>inventory.get(id)||{stock_us:0,stock_uk:0},activeItems=selection=>selection.items.filter(item=>!item.is_removed);
    function aggregate(){const totals=new Map();selections.forEach(selection=>activeItems(selection).forEach(item=>totals.set(item.product_id,(totals.get(item.product_id)||0)+Number(item.actual_quantity||0))));return totals}
    function availability(){const branch=el('branch').value,result=[];aggregate().forEach((required,productId)=>{const product=products.find(value=>value.id===productId),stock=stockFor(productId),local=branch==='UK'?stock.stock_uk:stock.stock_us,other=branch==='UK'?stock.stock_us:stock.stock_uk;result.push({product,required,local,other,total:local+other,transfer:Math.max(0,required-local),missing:Math.max(0,required-local-other)})});return result}
    function selectService(id){const service=services.find(value=>value.id===id);if(!service)return;if(selections.has(id))selections.delete(id);else selections.set(id,{service,items:(service.items||[]).map((item,index)=>({product_id:item.product_id,product_name:item.product_name,barcode:item.barcode,actual_quantity:Number(item.default_quantity),template_quantity:Number(item.default_quantity),item_source:'TEMPLATE',is_removed:false,display_order:index}))});render();saveDraft()}
    function changeQty(serviceId,index,delta=null,value=null){const item=selections.get(serviceId)?.items[index];if(!item)return;const next=value!==null?Number(value):Number(item.actual_quantity)+delta;item.actual_quantity=Math.max(1,Number.isInteger(next)?next:1);render();saveDraft()}
    function toggleRemove(serviceId,index){const item=selections.get(serviceId)?.items[index];if(item){item.is_removed=!item.is_removed;render();saveDraft()}}
    function addProduct(serviceId,productId){const selection=selections.get(serviceId),product=products.find(value=>value.id===productId);if(!selection||!product)return;const existing=selection.items.find(item=>item.product_id===productId);if(existing){existing.is_removed=false;existing.actual_quantity+=1}else selection.items.push({product_id:product.id,product_name:product.product_name,barcode:product.barcode,actual_quantity:1,template_quantity:null,item_source:'MANUAL',is_removed:false,display_order:selection.items.length});render();saveDraft()}
    function render(){
      el('serviceOptions').innerHTML=services.map(service=>'<button class="service-option '+(selections.has(service.id)?'on':'')+'" data-service="'+service.id+'">'+escapeHtml(service.service_name)+'<small>'+((service.items||[]).length)+' sản phẩm mẫu</small></button>').join('');
      el('serviceOptions').querySelectorAll('[data-service]').forEach(button=>button.onclick=()=>selectService(button.dataset.service));el('noServices').style.display=services.length?'none':'block';el('emptySelection').style.display=selections.size?'none':'block';
      const branch=el('branch').value;
      el('selectedServices').innerHTML=[...selections.values()].map(selection=>'<div class="service-block"><div class="service-head"><strong>'+escapeHtml(selection.service.service_name)+'</strong><div><button class="mini scan" data-scan="'+selection.service.id+'">📷 Quét mã</button> <button class="mini" data-unselect="'+selection.service.id+'">Bỏ dịch vụ</button></div></div><div class="items">'+selection.items.map((item,index)=>{const stock=stockFor(item.product_id),local=branch==='UK'?stock.stock_uk:stock.stock_us,total=stock.stock_us+stock.stock_uk,cls=item.actual_quantity>total?'bad':item.actual_quantity>local?'warn':'';return '<div class="item '+(item.is_removed?'removed':'')+'"><div class="item-top"><div><div class="item-name">'+escapeHtml(item.product_name)+'</div><div class="barcode">'+escapeHtml(item.barcode)+' · '+(item.item_source==='TEMPLATE'?'Theo mẫu':'Thêm riêng')+'</div></div><button class="'+(item.is_removed?'undo':'remove')+'" data-remove="'+selection.service.id+':'+index+'">'+(item.is_removed?'Khôi phục':'Loại bỏ')+'</button></div><div class="qty"><button data-qty="'+selection.service.id+':'+index+':-1">−</button><input data-qty-input="'+selection.service.id+':'+index+'" type="number" min="1" step="1" value="'+item.actual_quantity+'" '+(item.is_removed?'disabled':'')+'><button data-qty="'+selection.service.id+':'+index+':1">+</button></div><div class="stock '+cls+'">Tồn US: '+stock.stock_us+' · UK: '+stock.stock_uk+(branch&&item.actual_quantity>local?(item.actual_quantity<=total?' · cần lấy bù':' · không đủ toàn hệ thống'):'')+'</div></div>'}).join('')+'</div><div class="add-row"><select data-add-select="'+selection.service.id+'"><option value="">Thêm sản phẩm đang có…</option>'+products.filter(product=>!selection.items.some(item=>item.product_id===product.id&&!item.is_removed)).map(product=>'<option value="'+product.id+'">'+escapeHtml(product.product_name)+' ('+escapeHtml(product.barcode)+')</option>').join('')+'</select><button class="mini" data-add="'+selection.service.id+'">Thêm</button></div></div>').join('');
      document.querySelectorAll('[data-unselect]').forEach(button=>button.onclick=()=>selectService(button.dataset.unselect));document.querySelectorAll('[data-remove]').forEach(button=>button.onclick=()=>{const [s,i]=button.dataset.remove.split(':');toggleRemove(s,Number(i))});document.querySelectorAll('[data-qty]').forEach(button=>button.onclick=()=>{const [s,i,d]=button.dataset.qty.split(':');changeQty(s,Number(i),Number(d))});document.querySelectorAll('[data-qty-input]').forEach(input=>input.onchange=()=>{const [s,i]=input.dataset.qtyInput.split(':');changeQty(s,Number(i),null,input.value)});document.querySelectorAll('[data-add]').forEach(button=>button.onclick=()=>{const select=document.querySelector('[data-add-select="'+button.dataset.add+'"]');addProduct(button.dataset.add,select.value)});document.querySelectorAll('[data-scan]').forEach(button=>button.onclick=()=>startScan(button.dataset.scan));renderWarnings();renderSummary();validate()
    }
    function renderWarnings(){const branch=el('branch').value,rows=availability();if(!branch){el('stockWarnings').innerHTML='<div class="notice warn">Chọn cơ sở để hệ thống tính nguồn hàng.</div>';return}el('stockWarnings').innerHTML=rows.map(row=>row.missing>0?'<div class="notice bad">❌ <b>'+escapeHtml(row.product.product_name)+'</b>: Tổng hai kho thiếu '+row.missing+' (cần '+row.required+', hiện có '+row.total+').</div>':row.transfer>0?'<div class="notice warn">🚚 <b>'+escapeHtml(row.product.product_name)+'</b>: Cần lấy '+row.transfer+' từ '+(branch==='US'?'UK':'MEDITECH')+' qua để dùng ngay.</div>':'<div class="notice ok">✅ <b>'+escapeHtml(row.product.product_name)+'</b>: đủ '+row.required+' tại cơ sở.</div>').join('')}
    function renderSummary(){el('summary').innerHTML=[...selections.values()].map(selection=>'<div class="summary-service"><strong>'+escapeHtml(selection.service.service_name)+'</strong>'+activeItems(selection).map(item=>'<div>• '+escapeHtml(item.product_name)+': '+item.actual_quantity+'</div>').join('')+'</div>').join('')}
    function validate(){const valid=el('customerName').value.trim()&&el('customerPhone').value.trim()&&el('branch').value&&selections.size&&[...selections.values()].some(selection=>activeItems(selection).length)&&!availability().some(row=>row.missing>0);el('submitButton').disabled=!valid}
    function draftData(){return{customer_name:el('customerName').value,customer_phone:el('customerPhone').value,branch:el('branch').value,idempotency_key:idempotencyKey,services:[...selections.values()].map(selection=>({service_id:selection.service.id,items:selection.items}))}}function saveDraft(){localStorage.setItem(draftKey,JSON.stringify(draftData()))}
    function restoreDraft(){try{const draft=JSON.parse(localStorage.getItem(draftKey)||'null');if(!draft)return;el('customerName').value=draft.customer_name||'';el('customerPhone').value=draft.customer_phone||'';el('branch').value=draft.branch||'';idempotencyKey=draft.idempotency_key||newIdempotencyKey();(draft.services||[]).forEach(saved=>{const service=services.find(value=>value.id===saved.service_id);if(service)selections.set(service.id,{service,items:saved.items||[]})})}catch(_){}}
    function clearDraft(){if(!confirm('Xóa toàn bộ thông tin đơn đang nhập?'))return;localStorage.removeItem(draftKey);selections.clear();idempotencyKey=newIdempotencyKey();el('customerName').value='';el('customerPhone').value='';el('branch').value='';render()}
    async function lookupCustomer(){const phone=el('customerPhone').value.trim();if(phone.length<4){el('customerSuggestion').style.display='none';return}try{const data=await api('/api/warehouse/customers/suggestion?'+authQuery+'&phone='+encodeURIComponent(phone));if(data.customer){el('customerSuggestion').style.display='block';el('customerSuggestion').innerHTML='Khách cũ: <b>'+escapeHtml(data.customer.customer_name)+'</b> — <button id="useCustomer" class="mini">Điền lại tên</button>';el('useCustomer').onclick=()=>{el('customerName').value=data.customer.customer_name;saveDraft();validate()}}else el('customerSuggestion').style.display='none'}catch(_){}}
    async function startScan(serviceId){scanTargetServiceId=serviceId;el('scannerOverlay').classList.add('on');await window.BarcodeScanner.start({target:el('scannerStage'),onDetected:code=>{const product=products.find(value=>value.barcode===code);if(!product){tg?.showAlert('Mã này chưa có trong kho. Hãy nhập sản phẩm trước.');return}addProduct(scanTargetServiceId,product.id);el('scannerOverlay').classList.remove('on')},onError:()=>tg?.showAlert('Không thể mở camera. Hãy kiểm tra quyền camera.')})}async function closeScanner(){await window.BarcodeScanner.stop();el('scannerOverlay').classList.remove('on')}
    async function submit(){if(el('submitButton').disabled)return;el('submitButton').disabled=true;el('submitButton').textContent='Đang ghi nhận đơn…';try{const payload={...draftData(),chat_id:chatId,submit:true,ts,sig,action,initData},data=await api('/api/warehouse/service-orders',{method:'POST',body:JSON.stringify(payload)});localStorage.removeItem(draftKey);const order=data.order;tg?.HapticFeedback?.notificationOccurred('success');tg?.showAlert((order.status==='APPROVED'?'Đã duyệt và trừ kho. ':'Đã gửi quản lý duyệt. ')+'Mã đơn: '+order.order_code);setTimeout(()=>tg?.close(),900)}catch(error){const detail=Array.isArray(error.details)?'\n'+error.details.map(value=>value.product_name+': thiếu '+value.missing).join('\n'):'';tg?.showAlert(error.message+detail);el('submitButton').textContent='Gửi đơn xuất kho';validate()}}
    async function init(){if(!chatId||!initData){el('loading').innerHTML='<div class="loader-card"><b>Vui lòng mở Mini App từ Telegram.</b></div>';return}try{const data=await api('/api/warehouse/service-order/bootstrap?'+authQuery);if(!data.service_order_enabled){location.replace('/mini-app/warehouse_export.html?'+authQuery);return}services=data.services||[];products=data.products||[];(data.inventory||[]).forEach(value=>inventory.set(value.product_id,{stock_us:Number(value.stock_us),stock_uk:Number(value.stock_uk)}));restoreDraft();render();el('loading').classList.add('hide')}catch(error){el('loading').innerHTML='<div class="loader-card"><b>Không tải được dữ liệu</b><div style="margin-top:8px;color:#b91c1c">'+escapeHtml(error.message)+'</div></div>'}}
    ['customerName','branch'].forEach(id=>el(id).addEventListener('input',()=>{render();saveDraft()}));el('customerPhone').addEventListener('input',()=>{validate();saveDraft();clearTimeout(customerTimer);customerTimer=setTimeout(lookupCustomer,450)});el('submitButton').onclick=submit;el('clearButton').onclick=clearDraft;el('closeScanner').onclick=closeScanner;init();
  </script>
</body>
</html>
