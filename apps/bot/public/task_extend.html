<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Xin gia hạn nhiệm vụ</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 20px 16px calc(24px + env(safe-area-inset-bottom));
      min-height: 100vh;
      background: var(--tg-theme-bg-color, #f4f6f8);
      color: var(--tg-theme-text-color, #17212b);
      font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .card {
      max-width: 520px;
      margin: 0 auto;
      padding: 20px;
      border-radius: 18px;
      background: var(--tg-theme-secondary-bg-color, #fff);
      box-shadow: 0 8px 24px rgb(0 0 0 / 8%);
    }
    h1 { margin: 0 0 6px; font-size: 22px; }
    .hint { margin: 0 0 20px; color: var(--tg-theme-hint-color, #718096); }
    label { display: block; margin: 16px 0 7px; font-weight: 700; }
    input, textarea {
      width: 100%;
      border: 1px solid var(--tg-theme-hint-color, #cbd5e0);
      border-radius: 12px;
      padding: 12px;
      background: var(--tg-theme-bg-color, #fff);
      color: var(--tg-theme-text-color, #17212b);
      font: inherit;
    }
    textarea { min-height: 110px; resize: vertical; }
    button {
      width: 100%;
      margin-top: 20px;
      border: 0;
      border-radius: 12px;
      padding: 13px 16px;
      background: var(--tg-theme-button-color, #2481cc);
      color: var(--tg-theme-button-text-color, #fff);
      font: inherit;
      font-weight: 700;
    }
    button:disabled { opacity: .6; }
    .task { margin-top: 14px; font-weight: 700; }
    .message { margin-top: 14px; padding: 10px 12px; border-radius: 10px; display: none; }
    .message.error { display: block; background: #fee2e2; color: #991b1b; }
    .message.success { display: block; background: #dcfce7; color: #166534; }
  </style>
</head>
<body>
  <main class="card">
    <h1>⏰ Xin gia hạn nhiệm vụ</h1>
    <p class="hint">Chọn thời hạn mới và nhập lý do để gửi người giao duyệt.</p>
    <div id="taskLabel" class="task"></div>

    <label for="dueAt">Gia hạn đến ngày, giờ</label>
    <input id="dueAt" type="datetime-local" required>

    <label for="reason">Lý do gia hạn</label>
    <textarea id="reason" maxlength="1000" placeholder="Ví dụ: Khách yêu cầu dời lịch gọi..." required></textarea>

    <div id="message" class="message"></div>
    <button id="submit" type="button">Gửi yêu cầu gia hạn</button>
  </main>

  <script>
    const tg = window.Telegram?.WebApp;
    const params = new URLSearchParams(window.location.search);
    const startParam = tg?.initDataUnsafe?.start_param || params.get('payload') || params.get('startapp') || '';
    const taskMatch = /^taskextend_(\d+)$/.exec(startParam);
    const displayCode = taskMatch?.[1] || params.get('task') || '';
    const dueAt = document.getElementById('dueAt');
    const reason = document.getElementById('reason');
    const submit = document.getElementById('submit');
    const message = document.getElementById('message');

    tg?.ready();
    tg?.expand();
    document.getElementById('taskLabel').textContent = displayCode ? `Nhiệm vụ #T-${displayCode}` : 'Không xác định được nhiệm vụ';

    const now = new Date();
    now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
    dueAt.min = now.toISOString().slice(0, 16);
    const defaultDue = new Date(now.getTime() + 60 * 60 * 1000);
    dueAt.value = defaultDue.toISOString().slice(0, 16);

    function showMessage(text, type) {
      message.textContent = text;
      message.className = `message ${type}`;
    }

    function toVietnameseDeadline(value) {
      const [date, time] = value.split('T');
      const [year, month, day] = date.split('-');
      return `${time} ${day}/${month}/${year}`;
    }

    submit.addEventListener('click', async () => {
      if (!tg?.initData) return showMessage('Vui lòng mở Mini App trực tiếp từ Telegram.', 'error');
      if (!displayCode) return showMessage('Không xác định được mã nhiệm vụ.', 'error');
      if (!dueAt.value) return showMessage('Vui lòng chọn thời gian mới.', 'error');
      if (!reason.value.trim()) return showMessage('Vui lòng nhập lý do gia hạn.', 'error');

      submit.disabled = true;
      showMessage('Đang gửi yêu cầu...', 'success');
      try {
        const response = await fetch('/api/task-management/extend', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'x-telegram-init-data': tg.initData
          },
          body: JSON.stringify({
            displayCode,
            dueInput: toVietnameseDeadline(dueAt.value),
            reason: reason.value.trim()
          })
        });
        const result = await response.json();
        if (!response.ok || !result.success) throw new Error(result.message || 'Không gửi được yêu cầu.');
        showMessage(result.message, 'success');
        submit.disabled = true;
        setTimeout(() => tg.close?.(), 900);
      } catch (error) {
        submit.disabled = false;
        showMessage(error.message, 'error');
      }
    });
  </script>
</body>
</html>
