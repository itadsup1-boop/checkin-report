<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <title>Tồn kho</title>

  <!--
    Shell của Mini App xem tồn kho.

    Toàn bộ giao diện và logic nằm trong /mini-app/warehouse/inventory/ dưới dạng
    ES module, chia theo tầng data / ui / screens, dùng chung hạ tầng ở
    /mini-app/shared-ui/ (core + icons). File này chỉ nạp phụ thuộc và điểm
    vào, không chứa logic — xem warehouse/inventory/README.md.

    URL này được giữ nguyên để nút "Xem Tồn Kho" của bot, router.html và hợp đồng
    tương thích trong module kho không phải thay đổi.
  -->

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!--
    __ASSET_V__ được timekeep_bot.js thay bằng token phiên bản (mtime mới nhất của
    các thư mục module kho) khi phục vụ file này. Cloudflare ghi đè Cache-Control
    thành 4 giờ nên phải đổi URL mới ép được client tải lại code mới.
  -->
  <!-- Token màu dùng chung cho cả ba Mini App kho; phải nạp TRƯỚC theme của app. -->
  <link rel="stylesheet" href="/mini-app/_v__ASSET_V__/shared-ui/theme-tokens.css">
  <link rel="stylesheet" href="/mini-app/_v__ASSET_V__/warehouse/inventory/theme.css">
</head>
<body>
  <div id="app" class="app">
    <div class="center">
      <div class="spinner" style="margin-bottom:14px"></div>
      <div class="strong">Đang mở màn hình tồn kho…</div>
    </div>
  </div>

  <script type="module" src="/mini-app/_v__ASSET_V__/warehouse/inventory/app.js"></script>

  <noscript>
    <div class="center">
      <div class="strong">Cần bật JavaScript để xem tồn kho.</div>
    </div>
  </noscript>
</body>
</html>
