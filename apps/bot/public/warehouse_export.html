<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <title>Xuất kho</title>

  <!--
    Shell của Mini App xuất kho.

    Toàn bộ giao diện và nghiệp vụ nằm trong /mini-app/warehouse-export/ dưới dạng
    ES module, chia theo tầng core / data / ui / flows. File này chỉ nạp phụ thuộc
    và điểm vào, không chứa logic — xem warehouse-export/README.md.

    URL này được giữ nguyên để nút "Xuất Kho" của bot và hợp đồng tương thích
    trong module kho không phải thay đổi.
  -->

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="/mini-app/vendor/quagga.min.js"></script>
  <script src="/mini-app/barcode-scanner.js"></script>
  <!--
    __ASSET_V__ được timekeep_bot.js thay bằng token phiên bản (mtime mới nhất của
    thư mục module) khi phục vụ file này. Cloudflare ghi đè Cache-Control thành
    4 giờ nên phải đổi URL mới ép được client tải lại code mới.
  -->
  <link rel="stylesheet" href="/mini-app/_v__ASSET_V__/warehouse-export/theme.css">
</head>
<body>
  <div id="app" class="app">
    <div class="screen-center">
      <div class="spinner" style="margin-bottom:14px"></div>
      <div class="strong">Đang mở màn hình xuất kho…</div>
    </div>
  </div>

  <script type="module" src="/mini-app/_v__ASSET_V__/warehouse-export/app.js"></script>

  <noscript>
    <div class="screen-center">
      <div class="strong">Cần bật JavaScript để dùng chức năng xuất kho.</div>
    </div>
  </noscript>
</body>
</html>
